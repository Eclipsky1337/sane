name: Nightly

on:
  schedule:
    # 02:26 Asia/Shanghai
    - cron: "26 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test nightly
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check out dev
        uses: actions/checkout@v7
        with:
          ref: dev

      - name: Record source commit
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: sane-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package: sane-linux-aarch64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            package: sane-windows-x86_64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            package: sane-macos-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            package: sane-macos-aarch64
    steps:
      - name: Check out nightly source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.test.outputs.commit }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binaries
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Unix binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package="${{ matrix.package }}"
          mkdir -p "dist/$package"
          cp "target/${{ matrix.target }}/release/sanec" "dist/$package/"
          cp "target/${{ matrix.target }}/release/sanei" "dist/$package/"
          cp LICENSE "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          rm -rf "dist/$package"

      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "${{ matrix.package }}"
          New-Item -ItemType Directory -Path "dist/$package" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/sanec.exe" "dist/$package/"
          Copy-Item "target/${{ matrix.target }}/release/sanei.exe" "dist/$package/"
          Copy-Item LICENSE "dist/$package/"
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip"
          Remove-Item -Recurse "dist/$package"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish nightly
    needs: [test, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      NIGHTLY_COMMIT: ${{ needs.test.outputs.commit }}
    steps:
      - name: Check out nightly source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.NIGHTLY_COMMIT }}
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: nightly-*
          path: dist
          merge-multiple: true

      - name: Update nightly tag
        shell: bash
        run: |
          git tag --force nightly "$NIGHTLY_COMMIT"
          git push --force origin refs/tags/nightly

      - name: Create or update nightly release
        shell: bash
        run: |
          short_commit=$(git rev-parse --short=12 "$NIGHTLY_COMMIT")
          notes="Automated build from dev commit $short_commit."

          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly dist/* --clobber
            gh release edit nightly \
              --title "Nightly" \
              --prerelease \
              --notes "$notes"
          else
            gh release create nightly dist/* \
              --verify-tag \
              --title "Nightly" \
              --prerelease \
              --notes "$notes"
          fi
